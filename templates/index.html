<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReWire | Demographics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --brand:#ec4899; --ink:#0B0F19; --sub:#475569; }
      .bg-app{background:linear-gradient(180deg,#f8fafc,#fff)}
      .card{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.08) blur(6px)}
      *:focus{outline:none!important;box-shadow:none!important}
      .btn{background:linear-gradient(135deg,#ec4899,#db2777)}
      .bar{height:3px;background:linear-gradient(90deg,#ec4899,#60a5fa)}
      .radio{display:flex;gap:.5rem;align-items:center}
      .radio input{width:18px;height:18px}
    </style>
  </head>
  <body class="min-h-screen bg-app text-[15px] text-[color:var(--ink)]">
    <header class="bg-white/80 backdrop-blur border-b">
      <div class="max-w-4xl mx-auto px-4 py-3">
        <div class="flex items-center justify-between">
          <div></div>
          <div class="text-xs text-slate-600">Step 1 of 4</div>
        </div>
        <div class="bar mt-2 w-1/4 rounded"></div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <form action="/intake" method="post" id="f" class="space-y-6">
        <section class="card rounded-2xl border p-6">
          <label for="pid" class="block text-sm font-medium mb-2">Participant ID</label>
          <input id="pid" name="pid" required autocomplete="off"
                 placeholder="e.g., Prolific PID"
                 class="w-full rounded-xl border px-3 py-2 bg-white/70" />
        </section>

        <section class="card rounded-2xl border p-6 space-y-5">
          <div>
            <label class="block text-sm font-medium mb-2">Age</label>
            <div class="grid sm:grid-cols-2 gap-3">
              <select name="AgeSel" id="ageSel" class="rounded-xl border px-3 py-2 bg-white/70" required>
                <option value="" selected disabled>Choose your age group…</option>
                <option>18-24</option><option>25-34</option><option>35-44</option>
                <option>45-54</option><option>55-64</option><option>65+</option>
                <option value="__exact">Enter exact age…</option>
              </select>
              <input id="ageExact" type="number" min="10" max="120" step="1"
                     placeholder="Exact age (years)"
                     class="rounded-xl border px-3 py-2 bg-white/70 hidden" />
              <input type="hidden" name="Age" id="ageFinal" />
            </div>
          </div>

          {% for x in DEMO %}
          <div>
            <label class="block text-sm font-medium mb-2">{{ x.q }}</label>
            {% if x.type == "rad" %}
              <div class="grid sm:grid-cols-2 gap-2">
                {% for o in x.opts %}
                <label class="radio">
                  <input type="radio" name="{{ x.n }}" value="{{ o }}" required />
                  <span class="text-sm">{{ o }}</span>
                </label>
                {% endfor %}
              </div>
            {% else %}
              <select name="{{ x.n }}" class="w-full rounded-xl border px-3 py-2 bg-white/70" required>
                {% for o in x.opts %}<option value="{{ o }}">{{ o }}</option>{% endfor %}
              </select>
            {% endif %}
          </div>
          {% endfor %}
        </section>

        <div class="flex items-center justify-end">
          <button id="btn"
                  class="btn inline-flex items-center justify-center rounded-xl text-white px-5 py-3 disabled:opacity-60 disabled:cursor-not-allowed transition">
            Continue
          </button>
        </div>
      </form>
    </main>

    <script>
      const f=document.getElementById("f"), b=document.getElementById("btn");
      f.addEventListener("submit",()=>{b.disabled=true;b.textContent="Submitting…";});
      const sel=document.getElementById("ageSel"),
            ex=document.getElementById("ageExact"),
            fin=document.getElementById("ageFinal");
      const push=()=>{ fin.value = sel.value==="__exact" ? ex.value : sel.value; };
      sel.addEventListener("change",()=>{ ex.classList.toggle("hidden", sel.value!=="__exact"); if(sel.value!=="__exact") ex.value=""; push(); });
      ex.addEventListener("input",push); push(); document.getElementById("pid").focus();
    </script>
  </body>
</html>
