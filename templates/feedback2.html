<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReWire | Feedback (Details)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-app {
        background: linear-gradient(180deg, #f8fafc, #fff);
      }
      .btn {
        background: linear-gradient(135deg, #ec4899, #db2777);
      }
      .btn-outline {
        border-color: #ec4899;
        color: #ec4899;
      }
      .btn-outline:hover {
        background: #ec48991a;
      }
      .bar {
        height: 3px;
        background: linear-gradient(90deg, #ec4899, #60a5fa);
        width: 100%;
      }
    </style>
  </head>
  <body class="min-h-screen bg-app text-slate-900">
    <header class="bg-white/80 backdrop-blur border-b">
      <div class="max-w-4xl mx-auto px-4 py-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div
              class="h-8 w-8 rounded-xl"
              style="background: linear-gradient(135deg, #ec4899, #60a5fa)"
            ></div>
            <h1 class="text-lg font-semibold">ReWire ML Study</h1>
          </div>
          <div class="text-xs text-slate-600">Feedback • Details</div>
        </div>
        <div class="bar mt-2 rounded"></div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      <form action="/submit" method="post" id="f" class="space-y-6">
        <input type="hidden" name="id" value="{{ id }}" />
        <input type="hidden" name="stimulus_id" value="{{ stimulus_id }}" />
        <input type="hidden" name="url" value="{{ url }}" />
        <input type="hidden" name="experienced" value="{{ experienced }}" />
        <input type="hidden" name="chills_amount" value="{{ chills_amount }}" />
        <input type="hidden" name="chills_length" value="{{ chills_length }}" />
        <input type="hidden" name="chills_waves" value="{{ chills_waves }}" />

        <section class="rounded-2xl border bg-white p-6">
          <label class="block mb-2 font-medium"
            >Please describe what in the video gave you chills and why you think
            that is.</label
          >
          <textarea
            name="description"
            rows="6"
            class="w-full rounded-xl border px-3 py-2 bg-white/70"
            placeholder="Your description..."
          ></textarea>
          <div class="pt-4">
            <label class="block mb-2 font-medium">Email (optional)</label>
            <input
              name="email"
              type="email"
              placeholder="Share your email if you want to be contacted for future studies or developments"
              class="w-full rounded-xl border px-3 py-2 bg-white/70"
            />
            <p class="text-[12px] text-slate-500 mt-1">
              Optional — used only for follow-up on future studies.
            </p>
          </div>
        </section>

        <div class="flex items-center justify-between">
          <button
            type="button"
            onclick="history.back()"
            class="btn-outline rounded-xl border px-5 py-3"
          >
            Back
          </button>
          <button
            id="btn"
            class="btn rounded-xl text-white px-5 py-3 disabled:opacity-60 disabled:cursor-not-allowed transition"
          >
            Submit
          </button>
        </div>
      </form>
    </main>
    <script>
      const f = document.getElementById("f"),
        b = document.getElementById("btn");
      f.addEventListener("submit", () => {
        b.disabled = true;
        b.textContent = "Submitting…";
      });
    </script>
  </body>
</html>
