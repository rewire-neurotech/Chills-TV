<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReWire | Thank you</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ok: #22c55e;
      }
      @keyframes pop {
        0% {
          transform: scale(0.7);
          opacity: 0.3;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen bg-gradient-to-b from-slate-50 to-white text-slate-900"
  >
    <main class="max-w-3xl mx-auto px-4 py-20 text-center">
      <div
        class="mx-auto max-w-md bg-white border rounded-2xl shadow-sm p-10"
        style="animation: pop 0.28s ease-out both"
      >
        <div
          class="mx-auto h-12 w-12 rounded-full bg-green-100 grid place-content-center mb-4"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-green-600"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
          </svg>
        </div>
        <h2 class="text-2xl font-semibold mb-2">Thank you!</h2>
        <p class="text-slate-600">
          Your response has been recorded for <b>{{ id }}</b>. {% if email %}<br />We’ll
          reach out at <b>{{ email }}</b> for future studies or developments.{%
          endif %}
        </p>
        <div class="mt-6">
          <a
            href="/"
            class="inline-block rounded-xl border px-5 py-3 text-pink-600 border-pink-400 hover:bg-pink-50"
            >Start over</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
