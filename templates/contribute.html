{% extends "base.html" %}
{% block content %}
<div class="screen" id="screen-contribute">
  <div class="col">
    <a class="back" href="/hub">‹ Profile</a>
    <h1 class="pg-title">Add a chills video</h1>
    <p class="pg-lede">Know a video that reliably gives people chills? Send it to the lab. Approved videos join the research and are shown to new participants.</p>
    <form method="POST" action="/contribute">
    <div class="field" style="margin-top:28px">
      <label>Paste the link</label>
      <input name="url" placeholder="https://youtube.com/…">
    </div>
    <div class="or" style="margin:20px 0 6px"><span>or</span></div>
    <div class="field">
      <label>Describe it and we will find it</label>
      <textarea name="description" rows="3" placeholder="e.g. the flash mob playing Ode to Joy in a Spanish square"></textarea>
    </div>
    <div class="actions" style="margin-top:22px"><button class="btn btn-p" type="submit">Send to the lab</button></div>
    </form>
  </div>
</div>

{% endblock %}
{% block page_js %}
{% if sent %}<script>document.addEventListener('DOMContentLoaded', function(){ toast('Sent \u2014 approved videos join the study'); });</script>{% endif %}
{% endblock %}
